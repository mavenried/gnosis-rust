[package]
name = "gnosis"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "6.0.0"
epub = "2.1.5"
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_14"] }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.20"
uuid = { version = "1.25.0", features = ["v4"] }
quick-xml = "0.42.0"
zip = "8.6.0"
gdk-pixbuf = { version = "0.22.0", features = ["v2_42"] }
time = "0.3.55"
webkit6 = { version = "0.6.1", features = ["v2_52"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
